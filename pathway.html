<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRUX Pathway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0C;--panel:#151517;--panel2:#1E1E20;--line:#2E2B24;--ink:#F4EFE3;--muted:#B9B2A0;--gold:#C9A24A;--gold2:#E3C56F;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:17px;line-height:1.55}
h1,h2,h3,.logo{font-family:'Space Grotesk',sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:24px 20px 72px}
.logo{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:24px;letter-spacing:.08em;color:var(--ink);text-decoration:none;margin-bottom:36px}
.eyebrow{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h1{margin:0 0 14px;font-size:44px;line-height:1.08;letter-spacing:-.02em}
h2{margin:0 0 20px;font-size:28px;line-height:1.2}
h3{margin:0 0 6px;font-size:19px}
.lead{color:var(--muted);margin:0 0 28px}
.bar{height:4px;background:var(--line);border-radius:2px;margin-bottom:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .25s}
.step{color:var(--muted);font-size:14px;margin:0 0 22px}
.opts{display:grid;gap:12px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:14px 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:500;cursor:pointer}
.opt small{display:block;color:var(--muted);font-weight:400;font-size:14px}
.opt:hover{border-color:var(--gold)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn{min-height:48px;padding:0 26px;border-radius:8px;border:2px solid var(--gold);background:var(--gold);color:#0B0B0C;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:20px}
.card p{margin:0;color:var(--muted)}
.badge{display:inline-block;padding:6px 14px;border-radius:999px;border:1px solid var(--gold);color:var(--gold2);font-weight:600;font-size:14px;margin-bottom:14px}
.tech{display:grid;gap:18px}
.tech div,.wk{border-top:1px solid var(--line);padding-top:16px}
.wk b{color:var(--gold2);font-family:'Space Grotesk',sans-serif}
.note{font-size:14px;color:var(--muted);margin-top:28px}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
#app.fresh>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
#app.fresh>:nth-child(2){animation-delay:.06s}#app.fresh>:nth-child(3){animation-delay:.12s}#app.fresh>:nth-child(4){animation-delay:.18s}#app.fresh>:nth-child(5){animation-delay:.24s}#app.fresh>:nth-child(n+6){animation-delay:.3s}
.opt{transition:transform .15s ease,border-color .15s ease}
.opt:hover{transform:translateX(4px)}
.btn{transition:transform .15s ease,filter .15s ease}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.1)}
.rope{stroke-dasharray:60;animation:draw 1.4s ease .2s both}
.dot{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out 1.6s infinite}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
label{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
input{width:100%;height:48px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:0 14px;font:inherit}
input:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.card p.err{color:#FF9B8A;min-height:1.4em;font-size:14px;margin:8px 0 0}
.lnk{background:none;border:0;color:var(--gold2);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
.sk{height:14px;border-radius:7px;background:var(--panel2);margin-top:12px}
.lock{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2);margin-bottom:8px}
</style>
</head>
<body>
<main class="wrap">
<a class="logo" href="#" aria-label="CRUX home">CRU<svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke-width="3.2" aria-hidden="true"><path d="M4 3 L24 25" stroke="#F4EFE3" stroke-linecap="square"/><path class="rope" d="M24 3 C16 9 12 19 4 25" stroke="#C9A24A" stroke-linecap="round"/><circle class="dot" cx="14" cy="14" r="3.4" fill="#C9A24A" stroke="#0B0B0C" stroke-width="2"/></svg></a>
<div id="app"></div>
</main>
<script>
var LV=["Foundations","Building","Progressing","Advanced"];
var Q=[
{k:"self",t:"How would you describe yourself as a climber?",o:[["0","Beginner","Learning the basics"],["1","Improving","Comfortable, getting better"],["2","Intermediate","Consistent and technical"],["3","Advanced","Strong and experienced"]]},
{k:"grade",t:"What boulder grade do you climb comfortably?",s:"Indoor grades vary between gyms, so go with what feels normal for you (V-scale).",o:[["x","Not sure yet"],["0","V0 to V1"],["1","V2 to V3"],["2","V4 to V5"],["3","V6 and up"]]},
{k:"focus",t:"What holds you back most?",o:[["foot","Footwork"],["read","Reading problems"],["power","Pulling power"],["endu","Endurance"],["steep","Steep and overhanging climbs"],["slop","Slopers and pinches"],["fear","Fear of falling"],["x","Not sure"]]},
{k:"shoe",t:"What are you climbing in right now?",o:[["rent","Rental shoes"],["flat","Flat, comfortable shoes"],["mod","Moderately downturned shoes"],["agg","Aggressive, performance shoes"]]},
{k:"freq",t:"How often do you climb each week?",o:[["1","Once"],["2","Two or three times"],["4","Four or more"]]}
];
var TECH={
foot:[["Silent feet","Look at the foot hold until your toe lands, then place it without scraping. Quiet feet are precise feet."],["Edging and smearing","Practise standing on small edges with your inside and outside edge, and trusting friction on smooth holds."],["Flagging","Use a free leg for balance on the opposite side so the wall stops pushing you off."]],
read:[["Read before you pull on","Find the start and finish holds, trace the hand sequence, and decide where your feet go."],["Sequencing and beta","Try two or three different sequences on the same problem and notice which feels easiest."],["Planning rests","Spot the stable positions mid-problem where you can shake out before the hard move."]],
power:[["Hips close to the wall","Keep your hips in so your skeleton carries weight rather than your arms."],["Lock-offs","Practise holding positions with a bent arm, then reaching, on easier terrain."],["Deadpoints","Learn controlled dynamic moves that use your legs for momentum, not just your arms."]],
endu:[["Volume on easy problems","Link many problems well below your limit with good technique and steady breathing."],["Shaking out","Drop an arm, relax your grip and breathe whenever you find a good hold."],["Pacing","Move steadily and avoid gripping harder than you need to."]],
steep:[["Heel and toe hooks","Use your feet to pull in and take weight off your arms on overhangs."],["Core tension","Keep your feet on by engaging your core as you move between holds."],["Drop knees","Twist your hips and drop a knee to reach further on steep walls."]],
slop:[["Open-hand grip","Use the whole palm and fingers on slopers rather than crimping."],["Body position","Place your hips below or beside the hold so you pull in and down."],["Compression","Squeeze between holds with hands and feet to hold yourself on the wall."]],
fear:[["Progressive falling","Practise falling from low heights onto padded floors, then build up slowly."],["Down-climbing","Get comfortable reversing moves so you always have a way out."],["Landing safely","Learn to land on both feet with soft knees, and to roll out of a bad landing."]],
x:[["Footwork basics","Place your feet precisely and stand on them, so your legs do more of the work."],["Hips and balance","Turn your hips side-on and keep your weight over your feet."],["Reading problems","Plan your hand and foot sequence before you leave the floor."]]
};
var S={i:0,a:{}};
var app=document.getElementById("app");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function intro(){
app.className="fresh";
app.innerHTML='<p class="eyebrow">The CRUX Pathway</p><h1>Know what to learn next.</h1><p class="lead">Answer five quick questions about your climbing. We’ll build you a four-week plan with techniques to learn, a weekly structure and gear suggestions.</p><button class="btn" id="go">Start the quiz</button>';
document.getElementById("go").onclick=function(){S.i=0;S.a={};ask()};
}
function ask(keep){
var q=Q[S.i],cur=S.a[q.k];
app.className=keep?"":"fresh";
var h='<div class="bar"><i style="width:'+(S.i/Q.length*100)+'%"></i></div><p class="step">Question '+(S.i+1)+' of '+Q.length+'</p><h2>'+esc(q.t)+'</h2>';
if(q.s)h+='<p class="lead" style="margin-top:-8px">'+esc(q.s)+'</p>';
h+='<div class="opts">';
q.o.forEach(function(o){h+='<button class="opt" data-v="'+o[0]+'" aria-pressed="'+(cur===o[0])+'">'+esc(o[1])+(o[2]?'<small>'+esc(o[2])+'</small>':'')+'</button>'});
h+='</div><div class="row">'+(S.i>0?'<button class="btn ghost" id="back">Back</button>':'')+'<button class="btn" id="next"'+(cur===undefined?' disabled':'')+'>'+(S.i===Q.length-1?'See my Pathway':'Next')+'</button></div>';
app.innerHTML=h;
app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){S.a[q.k]=b.getAttribute("data-v");ask(true)}});
var bk=document.getElementById("back");if(bk)bk.onclick=function(){S.i--;ask()};
document.getElementById("next").onclick=function(){if(S.i===Q.length-1)result();else{S.i++;ask()}};
if(!keep)window.scrollTo(0,0);
}
function shoes(L,s){
if(s==="rent")return["Buy your first pair","Rentals are fine to learn in, but your own shoes fit better and last. Choose a flat or slightly downturned shoe that feels snug without hurting. Comfort matters more than performance right now."];
if(s==="flat"){return L>=2?["Consider a moderate downturn","You climb at a level where a more downturned shoe can help on steeper walls. Keep your flat pair for long sessions and technique days."]:["Keep your current shoes","A flat, comfortable shoe is a good fit at this level. Upgrading now is unlikely to help more than technique work will."]}
if(s==="mod"){return L>=3?["Consider a second, specialised pair","At your level, a softer shoe for smearing or a more aggressive one for steep climbs can be worth adding to your kit."]:["Keep your current shoes","Moderately downturned shoes suit most climbers at this level. Spend your effort on technique first."]}
return L<=1?["Consider a flatter pair for training","Aggressive shoes can hide weak footwork. A flatter pair for most sessions can help you build precise technique."]:["Keep your current shoes","Aggressive shoes suit your level. Keep a more comfortable pair for volume days so your feet and toes get a break."];
}
function finger(L){
return L<=1?["Skip finger boards for now","Build technique and climbing volume first. Tendons adapt more slowly than muscles, so patience pays off."]:L===2?["Finger training: wait or get guidance","Many coaches suggest climbing consistently for a year or more first. If you start, use a coach’s guidance and increase load gradually."]:["Structured finger training","Consider it with a coach or a proven programme, and progress gradually, with rest days built in."];
}
var mode="up";
function gate(L,t){
var up=mode==="up";
app.className="fresh";
app.innerHTML='<p class="eyebrow">Your CRUX Pathway</p><span class="badge">Level: '+LV[L]+'</span><h1>Your plan is ready.</h1><p class="lead">Here’s a first look. Create a free account or sign in to unlock your full four-week plan and gear advice.</p>'
+'<div class="card"><h3>First technique: '+esc(t[0][0])+'</h3><p>'+esc(t[0][1])+'</p></div>'
+'<div class="card" aria-hidden="true"><span class="lock">Locked</span><h3>Weekly plan and gear advice</h3><div class="sk" style="width:92%"></div><div class="sk" style="width:76%"></div><div class="sk" style="width:84%"></div></div>'
+'<div class="card"><h2 style="font-size:22px;margin-bottom:4px">'+(up?'Create your free account':'Welcome back')+'</h2><form id="au" novalidate><label for="em">Email</label><input id="em" type="email" autocomplete="email"><label for="pw">Password</label><input id="pw" type="password" autocomplete="'+(up?'new-password':'current-password')+'"><p class="err" id="er" role="alert"></p><div class="row" style="margin-top:8px"><button class="btn" type="submit">'+(up?'Create account':'Sign in')+'</button><button class="btn ghost" type="button" id="gg">Continue with Google</button></div></form>'
+'<p style="margin-top:18px;font-size:15px">'+(up?'Already have an account? ':'New to CRUX? ')+'<button class="lnk" id="sw">'+(up?'Sign in':'Create an account')+'</button></p><p class="note" style="margin-top:12px">Prototype only: no real account is created yet.</p></div>';
document.getElementById("sw").onclick=function(){mode=up?"in":"up";gate(L,t)};
document.getElementById("gg").onclick=function(){S.user="google";result()};
document.getElementById("au").onsubmit=function(e){e.preventDefault();var em=document.getElementById("em").value,pw=document.getElementById("pw").value;if(!/.+@.+\..+/.test(em)||pw.length<6){document.getElementById("er").textContent="Enter a valid email and a password of at least 6 characters.";return}S.user=em;result()};
window.scrollTo(0,0);
}
function result(){
app.className="fresh";
var a=S.a,L=a.grade!=="x"?+a.grade:+a.self;
var t=TECH[a.focus]||TECH.x;
var f=+a.freq,sess=f===1?"With one session a week, fit one technique drill and a few problems into each visit.":f===2?"Use session A for technique drills and volume, and session B for problems near your limit.":"With four or more sessions, keep at most two hard days a week and use the rest for easy technique or rest.";
var sh=shoes(L,a.shoe),fg=finger(L);
if(!S.user){gate(L,t);return}
var h='<p class="eyebrow">Your CRUX Pathway</p><span class="badge">Level: '+LV[L]+'</span><h1>Your four-week plan.</h1><p class="lead">Built from your level and your biggest challenge. Repeat it, then take the quiz again to see your next step.</p>';
h+='<h2>Techniques to learn</h2><div class="card tech">'+t.map(function(x){return'<div><h3>'+esc(x[0])+'</h3><p>'+esc(x[1])+'</p></div>'}).join("")+'</div>';
h+='<h2>Weekly plan</h2><div class="card"><p style="margin-bottom:16px">'+esc(sess)+' Warm up for 10 to 15 minutes before every session.</p>'
+'<div class="wk"><b>Week 1.</b> <span style="color:var(--muted)">Climb well below your limit and focus on “'+esc(t[0][0])+'”.</span></div>'
+'<div class="wk" style="margin-top:14px"><b>Week 2.</b> <span style="color:var(--muted)">Add “'+esc(t[1][0])+'” and attempt a few problems at your level.</span></div>'
+'<div class="wk" style="margin-top:14px"><b>Week 3.</b> <span style="color:var(--muted)">Add “'+esc(t[2][0])+'” and pick one project to work on.</span></div>'
+'<div class="wk" style="margin-top:14px"><b>Week 4.</b> <span style="color:var(--muted)">Easier week: repeat your favourite problems and let your body recover. Then retake the quiz.</span></div></div>';
h+='<h2>Gear</h2><div class="card tech"><div><h3>Shoes: '+esc(sh[0])+'</h3><p>'+esc(sh[1])+'</p></div><div><h3>Finger training: '+esc(fg[0])+'</h3><p>'+esc(fg[1])+'</p></div><div><h3>Chalk and brush</h3><p>A chalk bag and a soft brush are worth having at every level. Clean holds are easier to hold.</p></div></div>';
h+='<div class="row"><button class="btn" id="again">Retake the quiz</button><button class="btn ghost" id="out">Sign out</button></div><p class="note">This is general guidance, not a coaching or medical programme. Stop if something hurts, and see a professional for injuries. Gear comparisons are coming soon to CRUX.</p>';
app.innerHTML=h;
document.getElementById("again").onclick=function(){S.i=0;S.a={};intro()};
document.getElementById("out").onclick=function(){S.user=null;result()};
window.scrollTo(0,0);
}
intro();
</script>
</body>
</html>
